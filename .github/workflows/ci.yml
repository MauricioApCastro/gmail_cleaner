name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .
          ruff format --check .
      - name: Sintaxe
        run: python -m compileall -q .
